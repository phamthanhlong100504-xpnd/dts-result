name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dts-result
  DEPLOY_DIR: /dts/dts-result

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - uses: actions/cache@v4
        with: { path: ~/.m2/repository, key: '${{ runner.os }}-maven-${{ hashFiles("**/pom.xml") }}' }
      
      - run: ./mvnw clean package -B -DskipTests

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "docker-compose.prod.yml"
          target: ${{ env.DEPLOY_DIR }}

      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd ${{ env.DEPLOY_DIR }}
            mv -f docker-compose.prod.yml docker-compose.yml
            export GITHUB_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            sed -i "s/\${GITHUB_OWNER}/$GITHUB_OWNER/g" docker-compose.yml
            docker compose pull
            docker compose up -d
