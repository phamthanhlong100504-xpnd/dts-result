server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: dts-result

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dts_result_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:khoi0000}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "SET TimeZone = 'Asia/Ho_Chi_Minh'"

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: result-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        # Luôn deserialize về LearningResultEvent của dts-result, bỏ qua type header
        # (producer ngoài như kafka-console-producer không gửi __TypeId__; examination gửi header
        #  trỏ class package của nó khác package dts-result → ép về default type để khớp listener param)
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.dts.result.application.event.LearningResultEvent
    topic:
      learning-results: ${KAFKA_TOPIC_LEARNING_RESULTS:dts.learning-results}
      learning-results-dlt: ${KAFKA_TOPIC_LEARNING_RESULTS_DLT:dts.learning-results.DLT}

jwt:
  secret: ${JWT_ACCESS_SECRET:uPq3xK8mR5vY2wZ9aB4cD7eF1gH3iJ6kL0nO5pQ8rS2tU4vW6xY9zA1bC3dE7fG9}
  issuer: ${JWT_ISSUER:dts-identity-service}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    enabled: true
